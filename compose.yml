services:
  orca-profiles:
    build: .
    image: orca-profiles:latest
    # A stable name, so a redeploy replaces the running container rather than
    # racing it for the port.
    container_name: orca-profiles
    # Where to publish. Defaults to loopback; set ORCA_BIND to a LAN or tailnet
    # address to reach it from other machines. `0.0.0.0` publishes on every
    # interface, which on a docker host also means every bridge network.
    #
    # There is no authentication in front of this. Credentials are stripped
    # server-side (see src/domain/redact.ts), but anyone who can reach the port
    # can read your printer and filament presets, so keep it off untrusted
    # networks.
    ports:
      - "${ORCA_BIND:-127.0.0.1}:${ORCA_PORT:-8099}:8099"
    volumes:
      # The OrcaSlicer config. Read-only: this app never writes to it.
      - ${ORCA_CONFIG:-${HOME}/.config/OrcaSlicer}:/config:ro
    environment:
      ORCA_CONFIG_DIR: /config
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
