name: CI

# Pull requests only. A push run on `main` would duplicate every PR run for no
# extra signal — the same commits, the same gates.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # This repo is public, so GitHub-hosted minutes are free and there is no
    # reason to queue behind the self-hosted fleet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + lint + tests + build. The fixture is generated by the test
      # script, so there is nothing to restore from the repo.
      - run: pnpm gates
